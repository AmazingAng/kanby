name: Bug report
description: Report a reproducible Kanby problem
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, Agent Tokens, private repository data, or security vulnerabilities. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Kanby revision or deployment
      placeholder: Commit SHA or self-hosted version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and Cloudflare runtime details when relevant.
